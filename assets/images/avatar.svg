<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18132b"/>
      <stop offset="50%" stop-color="#0e0a1a"/>
      <stop offset="100%" stop-color="#07050d"/>
    </linearGradient>
    <linearGradient id="purpleNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="cyanNeon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0b5"/>
      <stop offset="60%" stop-color="#d49b78"/>
      <stop offset="100%" stop-color="#9d6b53"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e274d"/>
      <stop offset="50%" stop-color="#1a1530"/>
      <stop offset="100%" stop-color="#0e0c1a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="600" rx="32" fill="url(#bgGrad)"/>

  <!-- Tech Grid Background Pattern -->
  <g opacity="0.12" stroke="#a855f7" stroke-width="1">
    <path d="M0 100 H600 M0 200 H600 M0 300 H600 M0 400 H600 M0 500 H600" />
    <path d="M100 0 V600 M200 0 V600 M300 0 V600 M400 0 V600 M500 0 V600" />
  </g>

  <!-- Glowing Ring Accents -->
  <circle cx="300" cy="300" r="230" fill="none" stroke="url(#purpleNeon)" stroke-width="3" opacity="0.4" stroke-dasharray="12 8" />
  <circle cx="300" cy="300" r="200" fill="none" stroke="url(#cyanNeon)" stroke-width="2" opacity="0.3" />
  <circle cx="300" cy="270" r="160" fill="url(#purpleNeon)" opacity="0.15" filter="url(#glow)"/>

  <!-- Character Silhouette & Clothing -->
  <path d="M140 560 C140 450, 200 410, 260 395 L260 340 L340 340 L340 395 C400 410, 460 450, 460 560 Z" fill="url(#metalGrad)" stroke="url(#purpleNeon)" stroke-width="2"/>
  
  <!-- Cybernetic Collar / Hoodie Details -->
  <path d="M230 420 L300 490 L370 420 L340 395 L300 430 L260 395 Z" fill="#130e24" stroke="url(#cyanNeon)" stroke-width="2"/>
  <line x1="300" y1="490" x2="300" y2="560" stroke="#a855f7" stroke-width="3" opacity="0.8"/>

  <!-- Neck -->
  <rect x="270" y="300" width="60" height="65" rx="10" fill="url(#skinGrad)"/>
  <!-- Neck shadow -->
  <path d="M270 330 Q300 350 330 330 L330 365 L270 365 Z" fill="#7a4e3b" opacity="0.4"/>

  <!-- Head Base -->
  <path d="M230 220 C230 140, 370 140, 370 220 C370 290, 335 325, 300 325 C265 325, 230 290, 230 220 Z" fill="url(#skinGrad)"/>

  <!-- 3D Artist Hair - Stylized Futuristic Waves -->
  <path d="M215 210 C210 130, 250 80, 320 85 C380 90, 400 130, 385 190 C365 145, 335 130, 280 135 C240 140, 220 170, 215 210 Z" fill="#150f24" stroke="url(#purpleNeon)" stroke-width="2"/>
  <path d="M230 160 C260 110, 340 100, 370 140 C350 120, 300 115, 250 145 Z" fill="#a855f7" opacity="0.6"/>

  <!-- Stylized VR / Cyber Designer Glasses -->
  <g filter="url(#glow)">
    <rect x="235" y="195" width="130" height="42" rx="12" fill="#0d091a" stroke="url(#purpleNeon)" stroke-width="3"/>
    <!-- Glass Glare / HUD Display -->
    <path d="M245 205 L290 205 L280 225 L240 225 Z" fill="url(#cyanNeon)" opacity="0.8"/>
    <path d="M305 205 L350 205 L345 225 L300 225 Z" fill="url(#purpleNeon)" opacity="0.7"/>
    <line x1="250" y1="215" x2="280" y2="215" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <circle cx="330" cy="215" r="3" fill="#ffffff"/>
  </g>

  <!-- Nose & Mouth subtle lines -->
  <path d="M295 250 L305 265 L295 268" fill="none" stroke="#9d6b53" stroke-width="3" stroke-linecap="round"/>
  <path d="M285 288 Q300 296 315 288" fill="none" stroke="#874e37" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Professional Studio Headset -->
  <path d="M205 210 C205 130, 395 130, 395 210" fill="none" stroke="#2a2245" stroke-width="10" stroke-linecap="round"/>
  <!-- Left Ear Cup -->
  <rect x="200" y="195" width="22" height="55" rx="8" fill="#130e24" stroke="url(#purpleNeon)" stroke-width="2.5"/>
  <!-- Right Ear Cup -->
  <rect x="378" y="195" width="22" height="55" rx="8" fill="#130e24" stroke="url(#purpleNeon)" stroke-width="2.5"/>

  <!-- Floating Holographic Nodes (3D Coordinate Axis Gizmo) -->
  <g transform="translate(450, 150)">
    <circle cx="0" cy="0" r="26" fill="#120c24" stroke="#a855f7" stroke-width="2"/>
    <line x1="0" y1="0" x2="16" y2="0" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="0" y2="-16" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-10" y2="10" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
    <text x="-4" y="2" fill="#ffffff" font-family="monospace" font-size="7" font-weight="bold">3D</text>
  </g>

  <!-- Floating Badge: Blender / Maya / Unreal -->
  <g transform="translate(100, 420)">
    <rect x="-10" y="-14" width="110" height="34" rx="17" fill="#161129" stroke="url(#cyanNeon)" stroke-width="1.5" filter="url(#glow)"/>
    <circle cx="8" cy="3" r="5" fill="#22c55e"/>
    <text x="22" y="7" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold">3D SENIOR</text>
  </g>
</svg>