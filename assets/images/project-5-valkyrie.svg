<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="valkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140a24"/>
      <stop offset="50%" stop-color="#0d0717"/>
      <stop offset="100%" stop-color="#050308"/>
    </linearGradient>
    <linearGradient id="goldPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="sculptClay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#473a5a"/>
      <stop offset="50%" stop-color="#2d223d"/>
      <stop offset="100%" stop-color="#191224"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#valkBg)"/>

  <!-- Dramatic Rim Lighting Ring -->
  <circle cx="400" cy="230" r="190" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.3"/>
  <circle cx="400" cy="230" r="160" fill="#7c3aed" opacity="0.15"/>

  <!-- Valkyrie Winged Helmet & Bust Sculpt -->
  <!-- Left Wing Ornament -->
  <path d="M330 190 C 260 130, 210 90, 180 50 C 230 100, 250 150, 310 200 Z" fill="url(#goldPlate)"/>
  <path d="M320 210 C 240 160, 190 130, 150 90 C 210 140, 240 180, 300 220 Z" fill="url(#goldPlate)" opacity="0.8"/>
  <!-- Right Wing Ornament -->
  <path d="M470 190 C 540 130, 590 90, 620 50 C 570 100, 550 150, 490 200 Z" fill="url(#goldPlate)"/>
  <path d="M480 210 C 560 160, 610 130, 650 90 C 590 140, 560 180, 500 220 Z" fill="url(#goldPlate)" opacity="0.8"/>

  <!-- Sculpted Shoulders / Gorget -->
  <path d="M260 410 C 300 340, 500 340, 540 410 L 400 450 Z" fill="url(#sculptClay)" stroke="#c084fc" stroke-width="2"/>
  <path d="M320 360 C 360 320, 440 320, 480 360 L 400 420 Z" fill="#201533" stroke="#a855f7" stroke-width="1.5"/>

  <!-- Neck -->
  <rect x="375" y="270" width="50" height="70" fill="url(#sculptClay)"/>

  <!-- Sculpted Head & Face Plate -->
  <path d="M340 160 C 340 110, 460 110, 460 160 C 460 250, 420 290, 400 290 C 380 290, 340 250, 340 160 Z" fill="url(#sculptClay)" stroke="#d8b4fe" stroke-width="2"/>
  
  <!-- Sleek Visor Slit -->
  <path d="M365 180 L 435 180 L 400 195 Z" fill="#a855f7"/>
  <line x1="360" y1="180" x2="440" y2="180" stroke="#f472b6" stroke-width="3"/>

  <!-- High-Poly Polycount indicator -->
  <g transform="translate(60, 60)" opacity="0.85">
    <rect x="0" y="0" width="130" height="28" rx="6" fill="#130e26" stroke="#c084fc" stroke-width="1.2"/>
    <text x="12" y="18" fill="#e9d5ff" font-family="monospace" font-size="11" font-weight="bold">● ZBRUSH SCULPT</text>
  </g>
  <g transform="translate(620, 60)" opacity="0.85">
    <rect x="0" y="0" width="120" height="28" rx="6" fill="#130e26" stroke="#a855f7" stroke-width="1.2"/>
    <text x="12" y="18" fill="#d8b4fe" font-family="monospace" font-size="11" font-weight="bold">32M POLYGONS</text>
  </g>
  <text x="50" y="445" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">VALKYRIE PROTO-SCULPT</text>
  <text x="50" y="470" fill="#a1a1aa" font-family="'Segoe UI', Roboto, sans-serif" font-size="14">Digital Clay Sculpting, Retopology &amp; PBR Texturing</text>
</svg>