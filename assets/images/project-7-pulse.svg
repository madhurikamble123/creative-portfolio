<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="canBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#100820"/>
      <stop offset="50%" stop-color="#1d0e3a"/>
      <stop offset="100%" stop-color="#090512"/>
    </linearGradient>
    <linearGradient id="canBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="30%" stop-color="#6b21a8"/>
      <stop offset="60%" stop-color="#c084fc"/>
      <stop offset="85%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="splashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#canBg)"/>

  <!-- Dramatic Radial Backdrop Lighting -->
  <circle cx="400" cy="240" r="180" fill="#a855f7" opacity="0.2"/>

  <!-- Dynamic Fluid Splash Simulation Splatters -->
  <path d="M260 280 C 180 200, 220 120, 290 100 C 310 130, 290 180, 330 200 Z" fill="url(#splashGrad)" opacity="0.85"/>
  <path d="M540 280 C 620 200, 580 120, 510 100 C 490 130, 510 180, 470 200 Z" fill="url(#splashGrad)" opacity="0.85"/>
  <path d="M300 360 C 220 380, 180 430, 240 450 C 280 440, 310 400, 340 370 Z" fill="url(#splashGrad)" opacity="0.8"/>
  <path d="M500 360 C 580 380, 620 430, 560 450 C 520 440, 490 400, 460 370 Z" fill="url(#splashGrad)" opacity="0.8"/>

  <!-- Fluid Droplets floating around -->
  <circle cx="210" cy="150" r="10" fill="#38bdf8"/>
  <circle cx="250" cy="80" r="6" fill="#a855f7"/>
  <circle cx="330" cy="70" r="8" fill="#ec4899"/>
  <circle cx="580" cy="140" r="11" fill="#ec4899"/>
  <circle cx="540" cy="70" r="7" fill="#a855f7"/>
  <circle cx="470" cy="65" r="9" fill="#38bdf8"/>
  <circle cx="180" cy="380" r="8" fill="#a855f7"/>
  <circle cx="620" cy="390" r="9" fill="#38bdf8"/>

  <!-- 3D Sleek Aluminum Can (Angled) -->
  <g transform="translate(400, 250) rotate(-12) translate(-400, -250)">
    <!-- Can Body -->
    <rect x="350" y="130" width="100" height="230" rx="14" fill="url(#canBody)" stroke="#e9d5ff" stroke-width="1.5"/>
    <ellipse cx="400" cy="130" rx="46" ry="12" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
    <ellipse cx="400" cy="360" rx="46" ry="12" fill="#1e1b4b"/>

    <!-- Can Graphic Typography -->
    <text x="400" y="240" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="900" letter-spacing="3">PULSE</text>
    <text x="400" y="260" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold" letter-spacing="3">ENERGY • 0 CAL</text>
    <line x1="365" y1="280" x2="435" y2="280" stroke="#ec4899" stroke-width="2"/>
  </g>

  <!-- Tag & Labels -->
  <g transform="translate(60, 60)" opacity="0.85">
    <rect x="0" y="0" width="145" height="28" rx="6" fill="#130e26" stroke="#ec4899" stroke-width="1.2"/>
    <text x="12" y="18" fill="#f472b6" font-family="monospace" font-size="11" font-weight="bold">● COMMERCIAL &amp; FLUID</text>
  </g>
  <text x="50" y="445" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">PULSE DRINK 3D SPOT</text>
  <text x="50" y="470" fill="#a1a1aa" font-family="'Segoe UI', Roboto, sans-serif" font-size="14">Houdini Fluid Dynamics, Redshift Lighting &amp; Sound</text>
</svg>