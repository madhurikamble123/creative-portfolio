<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090514"/>
      <stop offset="60%" stop-color="#190e38"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#skyGrad)"/>

  <!-- Distant giant holographic moon/orb -->
  <circle cx="580" cy="160" r="90" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.6"/>
  <circle cx="580" cy="160" r="75" fill="#a855f7" opacity="0.15"/>
  <line x1="490" y1="160" x2="670" y2="160" stroke="#a855f7" stroke-width="1" opacity="0.4"/>

  <!-- Background Skyscrapers & Towers -->
  <rect x="80" y="160" width="70" height="260" fill="#0c071a"/>
  <rect x="170" y="120" width="90" height="300" fill="#130b26"/>
  <rect x="280" y="190" width="60" height="230" fill="#0f0820"/>
  <rect x="360" y="80" width="110" height="340" fill="#160d2e"/>
  <rect x="490" y="140" width="80" height="280" fill="#110924"/>
  <rect x="590" y="180" width="120" height="240" fill="#0d071a"/>

  <!-- Tower Spire Antennas with blinking lights -->
  <line x1="415" y1="20" x2="415" y2="80" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="415" cy="20" r="4" fill="#38bdf8"/>
  <line x1="215" y1="70" x2="215" y2="120" stroke="#ec4899" stroke-width="2"/>
  <circle cx="215" cy="70" r="3" fill="#ec4899"/>

  <!-- Holographic Billboards & Neon Window Matrix -->
  <!-- Tower 1 Windows -->
  <g fill="#a855f7" opacity="0.6">
    <rect x="185" y="140" width="8" height="6"/>
    <rect x="200" y="140" width="8" height="6"/>
    <rect x="215" y="140" width="8" height="6"/>
    <rect x="230" y="140" width="8" height="6"/>
    <rect x="185" y="160" width="8" height="6"/>
    <rect x="230" y="160" width="8" height="6"/>
    <rect x="200" y="180" width="8" height="6"/>
    <rect x="215" y="180" width="8" height="6"/>
  </g>
  <!-- Tower Center Hologram Billboard -->
  <rect x="375" y="130" width="80" height="65" fill="#1c0f38" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="415" y="168" text-anchor="middle" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="900" letter-spacing="2">OASIS</text>

  <!-- Wet Street Reflection / Ground Plane -->
  <rect x="0" y="420" width="800" height="80" fill="#080410"/>
  <line x1="0" y1="420" x2="800" y2="420" stroke="#a855f7" stroke-width="2"/>
  <!-- Light reflections on ground -->
  <ellipse cx="415" cy="440" rx="90" ry="8" fill="#38bdf8" opacity="0.3"/>
  <ellipse cx="215" cy="450" rx="60" ry="6" fill="#ec4899" opacity="0.3"/>
  <ellipse cx="580" cy="445" rx="80" ry="7" fill="#a855f7" opacity="0.4"/>

  <!-- Flying Cyber Highway Vehicle Streaks -->
  <line x1="100" y1="280" x2="300" y2="280" stroke="#ec4899" stroke-width="2" opacity="0.8"/>
  <circle cx="300" cy="280" r="3" fill="#ffffff"/>
  <line x1="450" y1="240" x2="650" y2="240" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
  <circle cx="650" cy="240" r="3" fill="#ffffff"/>

  <!-- Tag & Labels -->
  <g transform="translate(60, 60)" opacity="0.85">
    <rect x="0" y="0" width="140" height="28" rx="6" fill="#130e26" stroke="#a855f7" stroke-width="1.2"/>
    <text x="12" y="18" fill="#d8b4fe" font-family="monospace" font-size="11" font-weight="bold">● 3D ENVIRONMENT</text>
  </g>
  <text x="50" y="445" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">NEON OASIS 2099</text>
  <text x="50" y="470" fill="#a1a1aa" font-family="'Segoe UI', Roboto, sans-serif" font-size="14">Volumetric Fog, Cyberpunk Lighting &amp; Worldbuilding</text>
</svg>