<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0917"/>
      <stop offset="50%" stop-color="#140f29"/>
      <stop offset="100%" stop-color="#07040d"/>
    </linearGradient>
    <linearGradient id="neonP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8b4fe"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="neonC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="armorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2245"/>
      <stop offset="50%" stop-color="#1a142e"/>
      <stop offset="100%" stop-color="#0e0a1b"/>
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg1)"/>

  <!-- Perspective grid floor -->
  <g opacity="0.25" stroke="#a855f7" stroke-width="1">
    <line x1="0" y1="480" x2="800" y2="480"/>
    <line x1="0" y1="440" x2="800" y2="440"/>
    <line x1="0" y1="410" x2="800" y2="410"/>
    <line x1="0" y1="390" x2="800" y2="390"/>
    <line x1="400" y1="320" x2="0" y2="500"/>
    <line x1="400" y1="320" x2="150" y2="500"/>
    <line x1="400" y1="320" x2="300" y2="500"/>
    <line x1="400" y1="320" x2="500" y2="500"/>
    <line x1="400" y1="320" x2="650" y2="500"/>
    <line x1="400" y1="320" x2="800" y2="500"/>
  </g>

  <!-- Volumetric Purple Backlight -->
  <circle cx="400" cy="220" r="180" fill="url(#neonP)" opacity="0.18" filter="url(#glow1)"/>
  <circle cx="400" cy="220" r="230" fill="none" stroke="url(#neonP)" stroke-width="2" stroke-dasharray="10 15" opacity="0.4"/>

  <!-- Mecha Head & Torso Geometry -->
  <!-- Chest Chassis -->
  <polygon points="400,160 480,240 450,380 350,380 320,240" fill="url(#armorGrad)" stroke="url(#neonP)" stroke-width="2.5"/>
  <!-- Chest Core Glow -->
  <polygon points="400,210 435,260 400,310 365,260" fill="#0d091a" stroke="url(#neonC)" stroke-width="2.5"/>
  <circle cx="400" cy="260" r="16" fill="url(#neonC)" filter="url(#glow1)"/>
  
  <!-- Shoulders -->
  <polygon points="320,240 240,210 220,280 310,320" fill="url(#armorGrad)" stroke="url(#neonP)" stroke-width="2"/>
  <polygon points="480,240 560,210 580,280 490,320" fill="url(#armorGrad)" stroke="url(#neonP)" stroke-width="2"/>
  <circle cx="230" cy="245" r="8" fill="#a855f7" filter="url(#glow1)"/>
  <circle cx="570" cy="245" r="8" fill="#a855f7" filter="url(#glow1)"/>

  <!-- Mecha Helmet / Head -->
  <polygon points="400,80 445,130 430,190 370,190 355,130" fill="#1b1433" stroke="url(#neonP)" stroke-width="2.5"/>
  <!-- Visor -->
  <polygon points="375,140 425,140 420,160 380,160" fill="url(#neonC)" filter="url(#glow1)"/>
  <!-- Antennae / Crest -->
  <polygon points="400,60 410,100 390,100" fill="url(#neonP)"/>
  <line x1="360" y1="110" x2="330" y2="70" stroke="url(#neonP)" stroke-width="2.5"/>
  <line x1="440" y1="110" x2="470" y2="70" stroke="url(#neonP)" stroke-width="2.5"/>

  <!-- Digital Wireframe Overlay -->
  <g stroke="#38bdf8" stroke-width="1" opacity="0.6">
    <line x1="355" y1="130" x2="400" y2="160"/>
    <line x1="445" y1="130" x2="400" y2="160"/>
    <line x1="400" y1="160" x2="400" y2="210"/>
    <line x1="320" y1="240" x2="400" y2="260"/>
    <line x1="480" y1="240" x2="400" y2="260"/>
  </g>

  <!-- Rigging Skeleton Bones Gizmo -->
  <circle cx="400" cy="160" r="5" fill="#38bdf8"/>
  <circle cx="400" cy="380" r="5" fill="#38bdf8"/>
  <circle cx="320" cy="240" r="5" fill="#38bdf8"/>
  <circle cx="480" cy="240" r="5" fill="#38bdf8"/>

  <!-- HUD Graphic Elements -->
  <g transform="translate(60, 60)" opacity="0.85">
    <rect x="0" y="0" width="130" height="28" rx="6" fill="#130e26" stroke="#a855f7" stroke-width="1.2"/>
    <text x="12" y="18" fill="#d8b4fe" font-family="monospace" font-size="11" font-weight="bold">● RIGGED &amp; ANIMATED</text>
  </g>
  <g transform="translate(620, 60)" opacity="0.85">
    <rect x="0" y="0" width="120" height="28" rx="6" fill="#130e26" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="12" y="18" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">60 FPS • MAYA</text>
  </g>
  <text x="50" y="450" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">CYBER MECHA RIG</text>
  <text x="50" y="475" fill="#a1a1aa" font-family="'Segoe UI', Roboto, sans-serif" font-size="14">3D Character Animation &amp; Cinematic Lighting</text>
</svg>