<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="prismBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0817"/>
      <stop offset="50%" stop-color="#140f2b"/>
      <stop offset="100%" stop-color="#07050e"/>
    </linearGradient>
    <linearGradient id="prismEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="35%" stop-color="#a855f7"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="cardDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1836"/>
      <stop offset="100%" stop-color="#0f0c1b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#prismBg)"/>

  <!-- Glassmorphic Grid Backplane -->
  <g opacity="0.15" stroke="#a855f7" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
  </g>

  <!-- 3D Floating Prism Crystals -->
  <polygon points="400,100 480,220 400,340 320,220" fill="url(#cardDark)" stroke="url(#prismEdge)" stroke-width="2.5"/>
  <line x1="400" y1="100" x2="400" y2="340" stroke="#c084fc" stroke-width="1.5" opacity="0.8"/>
  <line x1="320" y1="220" x2="480" y2="220" stroke="#38bdf8" stroke-width="1.5" opacity="0.8"/>

  <!-- Floating Brand Identity Business Cards (Isometric tilt) -->
  <!-- Card 1 -->
  <g transform="translate(180, 240) rotate(-15)">
    <rect x="0" y="0" width="160" height="95" rx="8" fill="#18122c" stroke="#a855f7" stroke-width="1.5" opacity="0.95"/>
    <circle cx="30" cy="30" r="12" fill="url(#prismEdge)"/>
    <line x1="55" y1="25" x2="110" y2="25" stroke="#ffffff" stroke-width="2"/>
    <line x1="55" y1="35" x2="85" y2="35" stroke="#a855f7" stroke-width="1.5"/>
    <line x1="30" y1="65" x2="130" y2="65" stroke="#4b5563" stroke-width="1"/>
    <line x1="30" y1="75" x2="100" y2="75" stroke="#4b5563" stroke-width="1"/>
  </g>

  <!-- Card 2 (Overlapping) -->
  <g transform="translate(460, 260) rotate(12)">
    <rect x="0" y="0" width="170" height="100" rx="8" fill="#130e24" stroke="#c084fc" stroke-width="1.5" opacity="0.95"/>
    <text x="30" y="45" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold" letter-spacing="2">PRISM</text>
    <text x="30" y="65" fill="#a855f7" font-family="monospace" font-size="8" letter-spacing="1">STUDIO BRAND GUIDELINES</text>
  </g>

  <!-- Tag & Labels -->
  <g transform="translate(60, 60)" opacity="0.85">
    <rect x="0" y="0" width="150" height="28" rx="6" fill="#130e26" stroke="#c084fc" stroke-width="1.2"/>
    <text x="12" y="18" fill="#e9d5ff" font-family="monospace" font-size="11" font-weight="bold">● BRAND IDENTITY &amp; UI</text>
  </g>
  <text x="50" y="445" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">PRISM STUDIO IDENTITY</text>
  <text x="50" y="470" fill="#a1a1aa" font-family="'Segoe UI', Roboto, sans-serif" font-size="14">3D Logo Design, Brand Guidelines &amp; Typography</text>
</svg>